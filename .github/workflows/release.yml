name: Build and Release Application

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pyinstaller --name=flow --windowed `
            --hidden-import=PIL `
            --hidden-import=bs4 `
            --hidden-import=gdown `
            --hidden-import=requests `
            --hidden-import=PyQt6.QtWebSockets `
            --hidden-import=PyQt6.QtNetwork `
            --hidden-import=views `
            --hidden-import=views.main_window `
            --hidden-import=views.project_detail_widget `
            --hidden-import=views.import_dialog `
            --hidden-import=views.settings_dialog `
            --hidden-import=views.template_config_dialog `
            --hidden-import=views.video_check_dialog `
            --hidden-import=views.video_compare_widget `
            --hidden-import=models `
            --hidden-import=models.storage_manager `
            --hidden-import=models.project_model `
            --hidden-import=models.config_manager `
            --hidden-import=models.template_manager `
            --hidden-import=services `
            --hidden-import=services.text_processor `
            --hidden-import=services.downloader `
            --hidden-import=services.speech_extractor `
            --hidden-import=services.video_checker `
            --hidden-import=services.plugin_server `
            --hidden-import=services.pipeline_scheduler `
            main.py
          cp camera_motions.json dist/flow/
          cp prompt_templates.json dist/flow/
          cp LICENSE dist/flow/
          cp LICENSE.LIST dist/flow/
          cd dist
          Compress-Archive -Path flow -DestinationPath "flow-windows-$env:TAG_NAME.zip"

      - name: Build executable (macOS)
        if: matrix.os == 'macos-latest'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pyinstaller --name=flow --windowed \
            --hidden-import=PIL \
            --hidden-import=bs4 \
            --hidden-import=gdown \
            --hidden-import=requests \
            --hidden-import=PyQt6.QtWebSockets \
            --hidden-import=PyQt6.QtNetwork \
            --hidden-import=views \
            --hidden-import=views.main_window \
            --hidden-import=views.project_detail_widget \
            --hidden-import=views.import_dialog \
            --hidden-import=views.settings_dialog \
            --hidden-import=views.template_config_dialog \
            --hidden-import=views.video_check_dialog \
            --hidden-import=views.video_compare_widget \
            --hidden-import=models \
            --hidden-import=models.storage_manager \
            --hidden-import=models.project_model \
            --hidden-import=models.config_manager \
            --hidden-import=models.template_manager \
            --hidden-import=services \
            --hidden-import=services.text_processor \
            --hidden-import=services.downloader \
            --hidden-import=services.speech_extractor \
            --hidden-import=services.video_checker \
            --hidden-import=services.plugin_server \
            --hidden-import=services.pipeline_scheduler \
            main.py
          cp camera_motions.json dist/flow/
          cp prompt_templates.json dist/flow/
          cp LICENSE dist/flow/
          cp LICENSE.LIST dist/flow/
          cd dist
          zip -r "flow-macos-${TAG_NAME}.zip" flow

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

name: Build and Release Application

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pyinstaller --noconfirm flow.spec
          cp camera_motions.example.json dist/flow/camera_motions.json
          cp prompt_templates.example.json dist/flow/prompt_templates.json
          if (Test-Path camera_motions.example.json) { cp camera_motions.example.json dist/flow/ }
          if (Test-Path prompt_templates.example.json) { cp prompt_templates.example.json dist/flow/ }
          if (Test-Path .app_config.example.json) { cp .app_config.example.json dist/flow/ }
          if (Test-Path .env.example) { cp .env.example dist/flow/ }
          cp LICENSE dist/flow/
          cp LICENSE.LIST dist/flow/
          cd dist
          Compress-Archive -Path flow -DestinationPath "flow-windows-$env:TAG_NAME.zip"

      - name: Build executable (macOS)
        if: matrix.os == 'macos-latest'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pyinstaller --noconfirm flow.spec
          cp camera_motions.example.json dist/flow/camera_motions.json
          cp prompt_templates.example.json dist/flow/prompt_templates.json
          if [ -f camera_motions.example.json ]; then cp camera_motions.example.json dist/flow/; fi
          if [ -f prompt_templates.example.json ]; then cp prompt_templates.example.json dist/flow/; fi
          if [ -f .app_config.example.json ]; then cp .app_config.example.json dist/flow/; fi
          if [ -f .env.example ]; then cp .env.example dist/flow/; fi
          cp LICENSE dist/flow/
          cp LICENSE.LIST dist/flow/
          cd dist
          zip -r "flow-macos-${TAG_NAME}.zip" flow

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
